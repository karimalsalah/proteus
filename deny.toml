# cargo-deny policy: run by .github/workflows/audit.yml.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
# Everything bundled into the exe must allow redistribution in an MIT project.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0", "OFL-1.1", "Unlicense", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
