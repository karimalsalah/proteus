name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PROTEUS_SOUND: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Headless render
        shell: pwsh
        run: |
          $env:PROTEUS_DATA = "$env:RUNNER_TEMP\proteus"
          ./target/release/proteus.exe shot --vt forge/samples/basic.vt --out basic.png --size 1600x800
          if (-not (Test-Path basic.png)) { throw 'no image' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render
          path: basic.png
          if-no-files-found: ignore
