[package]
name = "proteus-sign"
version = "0.1.0"
edition = "2021"
description = "Signs PROTEUS release manifests. Not part of the product; the key never leaves the release machine."
license = "MIT"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

